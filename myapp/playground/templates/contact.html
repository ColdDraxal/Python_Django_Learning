{% load static %}
<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio — Minimal</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- HTMX CDN -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
</head>

<body
    class="bg-neutral-950 text-neutral-100 font-sans antialiased  selection:bg-neutral-100 selection:text-neutral-900">
    <h1 class=" max-w-6xl  mx-auto text-4xl text-white py-10"> Wellcome to Contact Page </h1>

    <section class="min-h-screen bg-gray-50 px-4 py-12 sm:px-6 lg:px-8">
        <div class="mx-auto flex min-h-[calc(100vh-6rem)] max-w-2xl items-center justify-center">

            <!-- Contact Card -->
            <article
                class="w-full border border-gray-200 bg-white p-6 shadow-sm transition-shadow duration-300 hover:shadow-md sm:p-8 lg:p-10">
                <header class="mb-8">
                    <p class="mb-2 text-sm font-medium uppercase tracking-wide text-gray-500">
                        Contact
                    </p>

                    <h1 class="text-3xl font-semibold tracking-tight text-gray-950 sm:text-4xl">
                        Get in touch
                    </h1>

                    <p class="mt-3 max-w-lg text-sm leading-6 text-gray-600 sm:text-base">
                        Have a question or want to work together?
                        Send us a message and we'll get back to you soon.
                    </p>
                </header>

                <form method="POST" class="space-y-6">

                    {% csrf_token %}

                    <!-- Name -->
                    <div>
                        <label for="name" class="block text-sm font-medium text-gray-900">
                            Name
                        </label>

                        <input id="name" name="name" type="text" autocomplete="name" placeholder="Your name" required
                            class="mt-2 block w-full border border-gray-300 bg-white px-3 py-3 text-sm text-gray-900 outline-none transition-all duration-200 placeholder:text-gray-400 hover:border-gray-500 focus:border-gray-950 focus:ring-1 focus:ring-gray-950" />
                    </div>

                    <!-- Email -->
                    <div>
                        <label for="email" class="block text-sm font-medium text-gray-900">
                            Email
                        </label>

                        <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com"
                            required
                            class="mt-2 block w-full border border-gray-300 bg-white px-3 py-3 text-sm text-gray-900 outline-none transition-all duration-200 placeholder:text-gray-400 hover:border-gray-500 focus:border-gray-950 focus:ring-1 focus:ring-gray-950" />
                    </div>

                    <!-- Contact -->
                     <div>
                        <label for="contact" class="block text-sm font-medium text-gray-900">
                            Contact
                        </label>

                        <input id="contact" name="contact" type="tel" autocomplete="contact" placeholder="Your contact number"
                            required
                            class="mt-2 block w-full border border-gray-300 bg-white px-3 py-3 text-sm text-gray-900 outline-none transition-all duration-200 placeholder:text-gray-400 hover:border-gray-500 focus:border-gray-950 focus:ring-1 focus:ring-gray-950" />
                    </div>

                    <!-- Subject -->
                    <div>
                        <label for="subject" class="block text-sm font-medium text-gray-900">
                            Subject
                        </label>

                        <input id="subject" name="subject" type="text" placeholder="What is this about?" required
                            class="mt-2 block w-full border border-gray-300 bg-white px-3 py-3 text-sm text-gray-900 outline-none transition-all duration-200 placeholder:text-gray-400 hover:border-gray-500 focus:border-gray-950 focus:ring-1 focus:ring-gray-950" />
                    </div>

                    <!-- Message -->
                    <div>
                        <label for="message" class="block text-sm font-medium text-gray-900">
                            Message
                        </label>

                        <textarea id="message" name="message" rows="6" placeholder="Write your message..." required
                            class="mt-2 block w-full resize-y border border-gray-300 bg-white px-3 py-3 text-sm leading-6 text-gray-900 outline-none transition-all duration-200 placeholder:text-gray-400 hover:border-gray-500 focus:border-gray-950 focus:ring-1 focus:ring-gray-950"></textarea>
                    </div>

                    <!-- Submit -->
                    <div class="pt-2">
                        <button type="submit"
                            class="inline-flex min-h-11 w-full items-center justify-center bg-gray-950 px-6 py-3 text-sm font-medium text-white transition-all duration-200 hover:-translate-y-0.5 hover:bg-gray-800 hover:shadow-md active:translate-y-0 focus:outline-none focus:ring-2 focus:ring-gray-950 focus:ring-offset-2 sm:w-auto">
                            Send message
                        </button>
                    </div>

                </form>
            </article>

        </div>
    </section>
</body>

</html>
